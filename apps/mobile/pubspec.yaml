name: foodfox
description: FoodFox — FOX Food Xplorer (Android)
publish_to: "none"
version: 0.3.7+12

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  file_picker: ^8.1.4
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  local_auth: ^2.3.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/fox_logo.png
    - assets/images/onboarding_hero.jpg
    - assets/recipes/
    - assets/demo/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
