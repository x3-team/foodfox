# Nginx site for FoodFox — copy to /etc/nginx/sites-available/foodfox
# Replace FOODFOX_DOMAIN with your test domain, then:
#   sudo ln -sf /etc/nginx/sites-available/foodfox /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d FOODFOX_DOMAIN

server {
    listen 80;
    server_name FOODFOX_DOMAIN;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }
}
