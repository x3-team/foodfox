# Nginx site for FoodFox at https://foodfox.yuri.guru
# Copy to /etc/nginx/sites-available/foodfox.yuri.guru
#
#   sudo bash deploy/vps/setup-foodfox-subdomain.sh
#
# DNS: A record foodfox.yuri.guru → VPS IP (212.67.13.64)

server {
    listen 80;
    server_name foodfox.yuri.guru;

    auth_basic "FoodFox Demo";
    auth_basic_user_file /etc/nginx/.htpasswd-foodfox;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }
}
