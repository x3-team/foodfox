# Nginx site for FoodFox at https://foodfox.yuri.guru
# Copy to /etc/nginx/sites-available/foodfox.yuri.guru
#
#   sudo bash deploy/vps/setup-foodfox-subdomain.sh
#
# DNS: A record foodfox.yuri.guru → VPS IP (212.67.13.64)
#
# Open site (no basic auth) but kept out of search: X-Robots-Tag here, and the
# app also sends it plus robots.txt Disallow. deploy/vps/nginx-apply.sh keeps
# the live file (with certbot's TLS blocks) in line on every deploy.

server {
    listen 80;
    server_name foodfox.yuri.guru;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }
}
