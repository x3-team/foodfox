# Nginx snippet for FoodFox demo at https://yuri.guru/demofox
# Include inside the yuri.guru server { } block BEFORE location / { ... }
#
# Setup:
#   sudo bash deploy/vps/setup-demofox-subpath.sh
#
# Requires htpasswd at /etc/nginx/.htpasswd-demofox (created by setup script).

location = /demofox {
    return 301 /demofox/;
}

location /demofox/ {
    auth_basic "FoodFox Demo";
    auth_basic_user_file /etc/nginx/.htpasswd-demofox;

    proxy_pass http://127.0.0.1:3030;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    client_max_body_size 20M;
}
