# iOS build + TestFlight upload (manual only).
#
# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   APPSTORE_ISSUER_ID     – Issuer ID (UUID) from App Store Connect API keys page
#   APPSTORE_KEY_ID        – Key ID of the API key (e.g. ABC123DEFG)
#   APPSTORE_PRIVATE_KEY   – full contents of AuthKey_<KEY_ID>.p8 (incl. BEGIN/END lines)
#   APPLE_TEAM_ID          – 10-char Apple Developer Team ID (developer.apple.com → Membership)
#
# How to create the API key:
#   App Store Connect → Users and Access → Integrations → App Store Connect API
#   → Team Keys → "+" → name it, role "App Manager" (or Admin) → Generate.
#   Copy the Issuer ID and Key ID, download the .p8 (downloadable only ONCE).
#
# Signing: automatic (cloud-managed) signing via the API key — xcodebuild is run with
# -allowProvisioningUpdates and the API key, so Xcode creates/fetches the distribution
# certificate and App Store profile itself. No cert/profile secrets needed.
# Prerequisites: the App ID guru.yuri.foodfox must exist in the developer account and an
# app record with that bundle id must be created in App Store Connect before upload.
#
# Set input "upload" to false to only build and archive the .ipa as an artifact.
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to TestFlight"
        type: boolean
        default: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install App Store Connect API key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Set team id
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" ios/ExportOptions.plist
          sed -i '' "s/CODE_SIGN_STYLE = Manual;/CODE_SIGN_STYLE = Automatic;/g" ios/Runner.xcodeproj/project.pbxproj || true

      - run: flutter pub get

      - name: Build xcarchive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # build number = 1000 + run number so every upload is unique
          flutter build ios --release --no-codesign \
            --build-number=$((1000 + GITHUB_RUN_NUMBER)) \
            --dart-define=FOX_API_BASE=https://foodfox.yuri.guru \
            --dart-define=FOX_BASIC_USER=demo \
            --dart-define=FOX_BASIC_PASS=FoodFox2026! \
            --dart-define=FOX_DEMO_PHONE=9251111111 \
            --dart-define=FOX_DEMO_OTP=1111
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}" \
            archive

      - name: Export signed .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}"
          ls -la build/ios/ipa

      - uses: actions/upload-artifact@v4
        with:
          name: foodfox-ios-ipa
          path: apps/mobile/build/ios/ipa/*.ipa

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        run: |
          xcrun altool --upload-app --type ios \
            --file "$(ls build/ios/ipa/*.ipa | head -1)" \
            --apiKey "${{ secrets.APPSTORE_KEY_ID }}" \
            --apiIssuer "${{ secrets.APPSTORE_ISSUER_ID }}"

      - name: Cleanup key
        if: always()
        run: rm -rf ~/.appstoreconnect
