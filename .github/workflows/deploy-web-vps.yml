name: Deploy web to VPS

on:
  push:
    branches: [cursor/mvp-web-prototype-5e5b]
    paths:
      - "apps/web/**"
      - "packages/database/**"
      - "deploy/vps/**"
      - "VERSION"
      - ".github/workflows/deploy-web-vps.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'x3-team/foodfox'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/foodfox
            bash deploy/vps/update.sh
