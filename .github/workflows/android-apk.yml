name: Build Android APK

on:
  push:
    branches: [cursor/mvp-web-prototype-5e5b, main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=FOX_API_BASE=https://foodfox.yuri.guru \
            --dart-define=FOX_BASIC_USER=demo \
            --dart-define=FOX_BASIC_PASS=FoodFox2026!

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodfox-android-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
